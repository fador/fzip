<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" width="100%" height="100%" style="background:#0d1117;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#56d364" />
    </linearGradient>

    <linearGradient id="deflateBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d2136" />
      <stop offset="100%" stop-color="#081424" />
    </linearGradient>

    <linearGradient id="zstdBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1438" />
      <stop offset="100%" stop-color="#120c24" />
    </linearGradient>

    <linearGradient id="boxBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <linearGradient id="arbiterBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241c08" />
      <stop offset="100%" stop-color="#141004" />
    </linearGradient>

    <linearGradient id="outBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d2a1b" />
      <stop offset="100%" stop-color="#071910" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#bc8cff" />
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d29922" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#56d364" />
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b949e" />
    </marker>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Title Banner -->
  <g transform="translate(40, 22)">
    <text x="0" y="24" font-size="22" font-weight="bold" fill="url(#headerGrad)">fzip Pipeline Architecture</text>
    <text x="0" y="44" font-size="12" fill="#8b949e">State-of-the-Art ZIP Compressor with Dual-Hash Matching, Optimal DP Parsing &amp; Custom Native Zstandard</text>
  </g>

  <!-- 1. Input Stage -->
  <g transform="translate(40, 78)" filter="url(#shadow)">
    <rect width="920" height="64" rx="8" fill="url(#boxBg)" stroke="#30363d" stroke-width="1.5" />
    
    <circle cx="28" cy="32" r="14" fill="#1f6feb" opacity="0.2" />
    <text x="28" y="37" font-size="13" font-weight="bold" fill="#58a6ff" text-anchor="middle">1</text>
    <text x="54" y="27" font-size="14" font-weight="bold" fill="#e6edf3">Input Ingestion &amp; Dispatch</text>
    <text x="54" y="46" font-size="11" fill="#8b949e">Files, wildcards, or @list files • File type detection &amp; incompressible skip • Multi-core parallel dispatch</text>

    <!-- Sub-badges -->
    <rect x="670" y="18" width="115" height="28" rx="5" fill="#21262d" stroke="#30363d" />
    <text x="727" y="36" font-size="11" fill="#79c0ff" text-anchor="middle">detect_file_type()</text>
    <rect x="795" y="18" width="105" height="28" rx="5" fill="#21262d" stroke="#30363d" />
    <text x="847" y="36" font-size="11" fill="#7ee787" text-anchor="middle">Store Fallback</text>
  </g>

  <!-- Connecting Lines from Stage 1 to Engines -->
  <path d="M 262 142 L 262 173" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 737 142 L 737 173" fill="none" stroke="#bc8cff" stroke-width="2" marker-end="url(#arrowPurple)" />
  <path d="M 500 142 L 500 508" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowMuted)" />

  <!-- 2. DEFLATE Engine (Left Column) -->
  <g transform="translate(40, 178)" filter="url(#shadow)">
    <rect width="445" height="305" rx="8" fill="url(#deflateBg)" stroke="#1f6feb" stroke-width="1.5" />
    
    <!-- Header -->
    <circle cx="28" cy="28" r="13" fill="#1f6feb" />
    <text x="28" y="33" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>
    <text x="50" y="26" font-size="15" font-weight="bold" fill="#58a6ff">DEFLATE Engine</text>
    <text x="50" y="42" font-size="11" fill="#8b949e">Method 8 (RFC 1951) • Levels 1–12 • Full 7za / zipfile compat</text>

    <!-- Block 1: Match Finding -->
    <g transform="translate(20, 60)">
      <rect width="405" height="64" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="14" y="22" font-size="12" font-weight="bold" fill="#79c0ff">Dual Hash-Chain Match Finder</text>
      <text x="14" y="40" font-size="10.5" fill="#c9d1d9">3-byte (head3/prev3) + 4-byte (head4/prev4) hash chains</text>
      <text x="14" y="54" font-size="10.5" fill="#8b949e">32 KB cross-block sliding history continuity • Pareto candidate pruning</text>
    </g>

    <!-- Block 2: Level Branching -->
    <g transform="translate(20, 134)">
      <!-- Left subcard: Levels 1-8 -->
      <rect x="0" y="0" width="195" height="84" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="10" y="20" font-size="11.5" font-weight="bold" fill="#d2a8ff">Levels 1–8: Lazy LZ77</text>
      <text x="10" y="38" font-size="10" fill="#c9d1d9">• Fast 1-step lookahead</text>
      <text x="10" y="52" font-size="10" fill="#c9d1d9">• O(1) Length/Dist LUTs</text>
      <text x="10" y="66" font-size="10" fill="#8b949e">High throughput: ~25 MB/s</text>

      <!-- Right subcard: Levels 9-12 -->
      <rect x="210" y="0" width="195" height="84" rx="6" fill="#161b22" stroke="#388bfd" />
      <text x="220" y="20" font-size="11.5" font-weight="bold" fill="#58a6ff">Levels 9–12: Optimal DP</text>
      <text x="220" y="38" font-size="10" fill="#c9d1d9">• Pareto match candidate pool</text>
      <text x="220" y="52" font-size="10" fill="#c9d1d9">• Iterative Huffman bit cost DP</text>
      <text x="220" y="66" font-size="10" fill="#8b949e">• Candidate cold-start guard</text>
    </g>

    <!-- Block 3: Entropy Coding -->
    <g transform="translate(20, 228)">
      <rect width="405" height="62" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="14" y="22" font-size="12" font-weight="bold" fill="#56d364">Dynamic Huffman &amp; Block Formation</text>
      <text x="14" y="40" font-size="10.5" fill="#c9d1d9">Package-Merge complete code builder (Kraft sum = 1)</text>
      <text x="14" y="54" font-size="10.5" fill="#8b949e">Parallel 256 KiB blocks • RLE tree encoding • Stored/Fixed fallback</text>
    </g>
  </g>

  <!-- 3. Zstandard Engine (Right Column) -->
  <g transform="translate(515, 178)" filter="url(#shadow)">
    <rect width="445" height="305" rx="8" fill="url(#zstdBg)" stroke="#8957e5" stroke-width="1.5" />
    
    <!-- Header -->
    <circle cx="28" cy="28" r="13" fill="#8957e5" />
    <text x="28" y="33" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">93</text>
    <text x="50" y="26" font-size="15" font-weight="bold" fill="#bc8cff">Custom Zstandard Engine</text>
    <text x="50" y="42" font-size="11" fill="#8b949e">Method 93 (RFC 8878) • Levels 1–22 • Hand-rolled, zero external deps</text>

    <!-- Block 1: Match Finding -->
    <g transform="translate(20, 60)">
      <rect width="405" height="64" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="14" y="22" font-size="12" font-weight="bold" fill="#d2a8ff">Dual-Hash &amp; Repeat-Offset Engine</text>
      <text x="14" y="40" font-size="10.5" fill="#c9d1d9">64K 3-byte + 128K 4-byte hash table with early length rejection</text>
      <text x="14" y="54" font-size="10.5" fill="#8b949e">Active rep 1-3 tracking • Hardware std::bit_width offset coding</text>
    </g>

    <!-- Block 2: Level Branching -->
    <g transform="translate(20, 134)">
      <!-- Left subcard: Levels 1-18 -->
      <rect x="0" y="0" width="195" height="84" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="10" y="20" font-size="11.5" font-weight="bold" fill="#79c0ff">Levels 1–18: Greedy / Lazy</text>
      <text x="10" y="38" font-size="10" fill="#c9d1d9">• 1-9: Independent blocks</text>
      <text x="10" y="52" font-size="10" fill="#c9d1d9">• 10+: Shared window (8 MiB)</text>
      <text x="10" y="66" font-size="10" fill="#8b949e">Cross-block match discovery</text>

      <!-- Right subcard: Levels 19-22 -->
      <rect x="210" y="0" width="195" height="84" rx="6" fill="#161b22" stroke="#ab7df8" />
      <text x="220" y="20" font-size="11.5" font-weight="bold" fill="#bc8cff">Levels 19–22: Multi-Pass DP</text>
      <text x="220" y="38" font-size="10" fill="#c9d1d9">• Forward pass longest &amp; rep</text>
      <text x="220" y="52" font-size="10" fill="#c9d1d9">• Backward shortest-path DP</text>
      <text x="220" y="66" font-size="10" fill="#8b949e">Multi-iteration cost feedback</text>
    </g>

    <!-- Block 3: Entropy Coding -->
    <g transform="translate(20, 228)">
      <rect width="405" height="62" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="14" y="22" font-size="12" font-weight="bold" fill="#56d364">FSE Sequences &amp; Huffman Literals</text>
      <text x="14" y="40" font-size="10.5" fill="#c9d1d9">Treeless literals &amp; 4-stream Huffman • tANS/FSE sequence tables</text>
      <text x="14" y="54" font-size="10.5" fill="#8b949e">Accuracy-log search • RFC 8878 frames with xxHash-64 checksum</text>
    </g>
  </g>

  <!-- Connecting Lines from Engines into Codec Arbiter -->
  <path d="M 262 483 L 262 508" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 737 483 L 737 508" fill="none" stroke="#bc8cff" stroke-width="2" marker-end="url(#arrowPurple)" />

  <!-- 3. Codec Selection & Optimization Arbiter (Full Width Hub) -->
  <g transform="translate(40, 514)" filter="url(#shadow)">
    <rect width="920" height="74" rx="8" fill="url(#arbiterBg)" stroke="#d29922" stroke-width="1.5" />
    
    <circle cx="28" cy="24" r="13" fill="#d29922" />
    <text x="28" y="29" font-size="12" font-weight="bold" fill="#141004" text-anchor="middle">★</text>
    <text x="52" y="22" font-size="14" font-weight="bold" fill="#f2cc60">Codec Selection &amp; Optimization Arbiter</text>
    <text x="52" y="38" font-size="11" fill="#8b949e">Direct CLI command routing or automated multi-engine trial evaluation</text>

    <!-- Subcards in the Arbiter -->
    <g transform="translate(430, 10)">
      <rect x="0" y="0" width="220" height="54" rx="5" fill="#161b22" stroke="#30363d" />
      <text x="12" y="20" font-size="11" font-weight="bold" fill="#e6edf3">Direct CLI Mode</text>
      <text x="12" y="36" font-size="10" fill="#8b949e">fzip deflate | zstd | store</text>
      <text x="12" y="48" font-size="9.5" fill="#79c0ff">Passes chosen payload directly</text>
    </g>

    <g transform="translate(660, 10)">
      <rect x="0" y="0" width="245" height="54" rx="5" fill="#161b22" stroke="#d29922" stroke-width="1.2" />
      <text x="12" y="20" font-size="11.5" font-weight="bold" fill="#f2cc60">fzip auto Mode (Trial Compression)</text>
      <text x="12" y="36" font-size="10" fill="#e6edf3">Runs Store vs Deflate-9/12 vs Zstd</text>
      <text x="12" y="48" font-size="9.5" fill="#7ee787">Selects smallest payload (Store is cost floor)</text>
    </g>
  </g>

  <!-- Connecting Line from Arbiter to Container Assembly -->
  <path d="M 500 588 L 500 610" fill="none" stroke="#56d364" stroke-width="2.5" marker-end="url(#arrowGreen)" />

  <!-- 4. ZIP / ZIP64 Container Assembly & Output -->
  <g transform="translate(40, 616)" filter="url(#shadow)">
    <rect width="920" height="92" rx="8" fill="url(#outBg)" stroke="#2ea043" stroke-width="1.5" />
    
    <circle cx="28" cy="26" r="14" fill="#238636" />
    <text x="28" y="31" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">✓</text>
    <text x="54" y="22" font-size="14" font-weight="bold" fill="#56d364">ZIP / ZIP64 Container Assembly &amp; Output</text>
    <text x="54" y="38" font-size="11" fill="#8b949e">Standard-compliant archive generation with deterministic, streaming output</text>

    <!-- Badges Row -->
    <g transform="translate(54, 48)">
      <rect x="0" y="0" width="180" height="30" rx="5" fill="#161b22" stroke="#30363d" />
      <text x="90" y="19" font-size="10.5" fill="#7ee787" text-anchor="middle">4 KB Data Alignment (v2)</text>

      <rect x="195" y="0" width="180" height="30" rx="5" fill="#161b22" stroke="#30363d" />
      <text x="285" y="19" font-size="10.5" fill="#79c0ff" text-anchor="middle">IEEE CRC-32 (Slicing-by-8)</text>

      <rect x="390" y="0" width="180" height="30" rx="5" fill="#161b22" stroke="#30363d" />
      <text x="480" y="19" font-size="10.5" fill="#d2a8ff" text-anchor="middle">ZIP64 (&gt;4 GB / 65K entries)</text>

      <rect x="585" y="0" width="265" height="30" rx="5" fill="#161b22" stroke="#238636" />
      <text x="717" y="19" font-size="10.5" font-weight="bold" fill="#56d364" text-anchor="middle">Verified with 7-Zip &amp; Python zipfile</text>
    </g>
  </g>
</svg>
